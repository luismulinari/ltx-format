name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the golden fixtures were generated with. Pinned so a change in
  # litestream's output shows up as a deliberate update, not as flaky CI.
  LITESTREAM_VERSION: 0.5.11

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install litestream
        run: |
          curl -fsSL -o /tmp/litestream.tar.gz \
            "https://github.com/benbjohnson/litestream/releases/download/v${LITESTREAM_VERSION}/litestream-${LITESTREAM_VERSION}-linux-x86_64.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/litestream.tar.gz litestream
          litestream version

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - run: npm run build

      - name: Check published package
        run: npm run check:package

      - name: Upload coverage
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
