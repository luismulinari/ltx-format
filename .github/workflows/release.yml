name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  LITESTREAM_VERSION: 0.5.11

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - name: Install litestream
        run: |
          curl -fsSL -o /tmp/litestream.tar.gz \
            "https://github.com/benbjohnson/litestream/releases/download/v${LITESTREAM_VERSION}/litestream-${LITESTREAM_VERSION}-linux-x86_64.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/litestream.tar.gz litestream

      - run: npm ci

      - name: Verify the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - run: npm run verify

      # No NPM_TOKEN: authentication and provenance come from the OIDC token.
      # Configure the trusted publisher once, at
      # https://www.npmjs.com/package/ltx-format/access
      - run: npm publish
